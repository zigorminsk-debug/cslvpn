# Этот файл создаёт и обновляет Kolibri Forge. Ручные правки будут перезаписаны.
name: Kolibri Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kolibri-build-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/ ./...
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: cslvpn-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          TITLE: "Сборка №${{ github.run_number }}"
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cd artifacts
          # Artifacts lose the executable bit; restore it for binaries and scripts.
          find . -type f | while IFS= read -r f; do
            case "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" in
              7f454c46|cffaedfe|cafebabe|2321*) chmod +x "$f" ;;
            esac
          done
          for d in */; do
            d="${d%/}"
            (cd "$d" && zip -qr "../$d.zip" .)
          done
          gh release create "$TAG" ./*.zip --target "$GITHUB_SHA" --title "$TITLE" --notes "${NOTES:-Автоматическая сборка}"
