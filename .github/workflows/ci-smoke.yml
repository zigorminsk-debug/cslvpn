name: smoke
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ci-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go version | tee /tmp/v.txt && uname -a >> /tmp/v.txt
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: /tmp/v.txt}
