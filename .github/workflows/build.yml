name: build

# Builds, tests and cross-compiles CSLVPN on every change.
# Triggered automatically on every push to any branch.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The project has zero external dependencies (no go.sum), so the Go build cache
# is just the default GOCACHE of the runner: nothing to configure here.
env:
  GO_VERSION: "stable"
  CGO_ENABLED: "0"


jobs:
  test:
    name: vet + tests (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go env
        run: |
          go version
          go env CGO_ENABLED
      - name: gofmt check
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "these files are not gofmt'd:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: unit + integration tests
        run: go test -count=1 ./...

      # The race detector needs cgo. It is enabled per step (the workflow level
      # CGO_ENABLED=0 keeps the shipped binaries static).
      - name: race detector
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          if ! command -v gcc >/dev/null; then sudo apt-get update && sudo apt-get install -y gcc; fi
          go test -race -count=1 ./...
      - name: build
        run: go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o cslvpn ./cmd/cslvpn
      # Cross-compilation is cheap here and catches platform-specific breakage
      # (build tags, syscall wrappers) long before the release matrix runs.
      - name: cross-compile smoke test
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/arm64 linux/arm; do
            GOOS=${target%/*} GOARCH=${target#*/} GOARM=7 go build -o /dev/null ./cmd/cslvpn
            echo "ok $target"
          done
      # Runner logs are not always reachable from automation; surface the reason
      # of a failure as an annotation so it shows up in the PR/commit checks.
      - name: diagnose
        if: failure()
        run: |
          set +e
          esc() { tr '\n' ' ' | tail -c 1500; }
          echo "::error::go version: $(go version 2>&1 | esc)"
          echo "::error::go env: $(go env GOFLAGS GOOS GOARCH CGO_ENABLED 2>&1 | esc)"
          echo "::error::gofmt: $(gofmt -d ./cmd ./internal 2>&1 | esc)"
          echo "::error::vet: $(go vet ./... 2>&1 | esc)"
          go test -race -count=1 ./... >/tmp/t.log 2>&1; echo "::error::race test exit=$? output: $(esc </tmp/t.log)"

  # The end-to-end tests need root (network namespaces, TUN devices), which the
  # hosted runners provide.
  e2e:
    name: e2e (netns + tun)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build
        run: go build -trimpath -o cslvpn ./cmd/cslvpn
      - name: enable tun
        run: |
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 666 /dev/net/tun
          ls -l /dev/net/tun
      - name: e2e - isolated networks, udp+tcp, isolation, admin api
        run: sudo -E bash scripts/e2e-test.sh
      - name: e2e - internet access through the relay (gateway + NAT)
        run: sudo -E bash scripts/nat-test.sh
      - name: collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          sudo find /tmp -maxdepth 2 -name 'relay.log' -o -maxdepth 2 -name 'client-*.log' 2>/dev/null \
            | xargs -r sudo cp -t "$RUNNER_TEMP/e2e-logs" 2>/dev/null || true
          sudo chown -R "$USER" "$RUNNER_TEMP/e2e-logs" || true
          ls -l "$RUNNER_TEMP/e2e-logs" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          out="cslvpn-${GOOS}-${GOARCH}${GOARM}${EXT}"
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" \
            -o "$out" ./cmd/cslvpn
          ls -lh "$out"
      - name: checksum
        run: sha256sum cslvpn-* > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: cslvpn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cslvpn-*
            SHA256SUMS-*.txt
          retention-days: 30

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -lh dist
      - name: tag name
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CSLVPN ${{ steps.meta.outputs.tag }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: dist/*
